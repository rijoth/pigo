# GoReleaser config. Build: `goreleaser release --clean` (needs a git tag).
# Dry run: `goreleaser release --snapshot --clean`.
version: 2

project_name: pigo

before:
  hooks:
    - go mod tidy

builds:
  - id: pigo
    main: ./cmd/pigo
    binary: pigo
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: pigo
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^style:"
